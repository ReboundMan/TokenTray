name: Build validation

# Demoted from a publishing release workflow (spec: TokenTray signing plan,
# following WordMD spec 10024's Open question 4 resolution): signing is
# local-only, so CI can only ever produce an unsigned installer and must not
# publish it. This job validates that the PyInstaller + Inno Setup chain still
# compiles on a clean machine; the artifact it uploads is -UNSIGNED-suffixed
# by installer/TokenTray.iss and is not releasable.
#
# Real releases are built and signed locally:
#   .\build.ps1 -Clean -Installer -Sign
#   gh release create v<version> --draft ... ; upload ; --draft=false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build TokenTray (onedir + unsigned installer)
        shell: pwsh
        run: |
          .\build.ps1 -Python "${{ env.pythonLocation }}\python.exe" -Clean -Installer

      - name: Upload validation artifact (UNSIGNED, not releasable)
        uses: actions/upload-artifact@v4
        with:
          name: TokenTray-build-validation-${{ github.ref_name }}
          path: |
            dist/TokenTray-Setup-*-UNSIGNED.exe
